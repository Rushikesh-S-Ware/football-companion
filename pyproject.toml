# Minimal packaging file — its ONLY job is to make our code importable as a
# package named "companion" so that commands like `python -m companion.chat`
# work while our source lives under src/.
#
# Runtime dependencies live in requirements.txt (per the project spec: "plain
# venv + requirements.txt"). This file is packaging plumbing, not Poetry/Pipenv.
#
# One-time setup after creating the venv:  pip install -e .
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-companion"
version = "0.1.0"
description = "Conversational La Liga / Champions League analyst agent (v1)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
